<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4A3F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="病历册">
<title>病历册</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4EF;--card:#FBFCFA;--ink:#1D2622;--mut:#66746C;--line:#D3DBD1;--pine:#1F4A3F;--onp:#fff;--seal:#B8432F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A17;--card:#1C2420;--ink:#E6ECE8;--mut:#93A39A;--line:#2E3A34;--pine:#5FA38C;--onp:#10201A;--seal:#E0715C}}
:root[data-theme="dark"]{--bg:#141A17;--card:#1C2420;--ink:#E6ECE8;--mut:#93A39A;--line:#2E3A34;--pine:#5FA38C;--onp:#10201A;--seal:#E0715C}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1,h2{font-family:"Noto Serif SC","Songti SC",SimSun,serif;margin:0}
h1{font-size:28px;color:var(--pine)}h2{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--pine);background:transparent;color:var(--pine);padding:8px 14px;border-radius:8px}
button.p{background:var(--pine);color:var(--onp)}button.d{border-color:var(--seal);color:var(--seal)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;margin:0 0 12px;color:var(--mut);font-size:14px}label>*{margin-top:4px;color:var(--ink)}
.q{font-size:17px;padding:13px 14px;margin-bottom:6px}
.yh{margin:18px 0 6px;color:var(--pine);font-family:"Noto Serif SC",serif;font-size:18px}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-top:8px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.row b{font-size:18px;font-weight:600}.row small,.mut{color:var(--mut)}
.row span+span{margin-left:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.v{position:relative}.v::before{content:"";position:absolute;left:-24px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--pine)}
.tag{display:inline-block;padding:0 9px;border-radius:6px;border:1px solid var(--pine);color:var(--pine);font-size:14px;margin-left:8px}
.tag.c{border-color:var(--seal);color:var(--seal)}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph div{position:relative}.ph img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.ph button{position:absolute;top:2px;right:2px;padding:0 7px;background:var(--card);border-color:var(--seal);color:var(--seal);border-radius:6px;line-height:1.4}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9}
#ov img{max-width:96vw;max-height:92vh}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:10}
.lock{max-width:340px;margin:18vh auto 0;text-align:center}.lock input{text-align:center;font-size:22px;margin:16px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{font-size:24px;padding:14px 0}.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pine)}.dots i.on{background:var(--pine)}
.sec{margin-bottom:12px}.lb{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:4px}.lb button{padding:0 8px;font-size:13px;border-color:var(--line);color:var(--mut)}.chips{margin:4px 0 6px}.chips small{color:var(--mut);margin-right:6px}.chip{padding:3px 10px;margin:3px 4px 3px 0;font-size:14px;border-color:var(--line);color:var(--ink)}.chip.on{background:var(--pine);color:var(--onp);border-color:var(--pine)}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--pine:#1F4A3F;--seal:#B8432F}
.top,.acts,.lb button,#toast,.noprint{display:none!important}.card{break-inside:avoid;border-color:#bbb}.ph img{width:170px;height:170px}main{max-width:none;padding:0}}
.fu{color:var(--seal);font-weight:600;margin:8px 0 0}
.frow{display:flex;gap:8px;margin-bottom:8px}.frow .fn{flex:2}.frow .fa{flex:1}.frow button{padding:0 12px;border-color:var(--seal);color:var(--seal)}.feetot{text-align:right;margin-top:6px}
.pn{border:0;padding:0;background:none;font-size:18px;color:var(--ink);text-align:left}dt.fu,dd.fu{margin:0}
</style></head>
<body><main id="a"></main><p id="ver" style="text-align:center;font-size:12px;color:#888;margin:0 0 30px">版本 14</p>
<script>
const A=document.getElementById('a'),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const toast=(m,ms=2600)=>{const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)};
let db,P=[],V=[],S={v:'list',q:''},ok=false;
const open=async()=>({});
const all=s=>cloudGet(s),put=(s,v)=>cloudPut(s,v),del=(s,k)=>cloudDelete(s,k);
const load=async()=>{P=await all('patients');V=await all('visits')};
const hash=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bc'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p'+btoa(unescape(encodeURIComponent(s)))}};
const PF=[['gender','性别'],['birth','出生'],['occ','职业'],['phone','电话'],['ic','身份证 / IC'],['addr','地址'],['memo','备注']];
const K=[['cc','主诉'],['wang','舌诊'],['pulse','脉象'],['appetite','食欲'],['sweat','出汗'],['cold','发冷 / 怕冷'],['stool','大便'],['urine','小便'],['sleep','睡眠'],['bloat','腹胀（肚子胀气）'],['menses','月经'],['wen','闻诊'],['ask','问诊'],['dx','诊断辨证'],['rx','处方'],['fee','治疗费用'],['note','医生备注']];
const yr=p=>(p.birth||'').match(/\d{4}/)?.[0]||'';
const go=(v,o={})=>{S={...S,v,...o};draw();scrollTo(0,0)};
const get=()=>Object.fromEntries([...A.querySelectorAll('[name]')].map(e=>[e.name,e.value]));
const F=(l,n,v='',ta,ex='')=>`<label>${l}${ta?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}" ${ex}>`}</label>`;
const Sel=(l,n,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select></label>`;
const vs=pid=>V.filter(v=>v.pid===pid).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
const hay=p=>[p.name,...PF.map(f=>p[f[0]]),yr(p),...V.filter(v=>v.pid===p.id).flatMap(v=>[v.date,v.type,...K.map(k=>v[k[0]])])].join('\n').toLowerCase();
const cmp=(a,b)=>a.name.localeCompare(b.name,'zh-u-co-pinyin');

const dayTxt=d=>{const t=new Date(d+'T00:00');return t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 星期'+'日一二三四五六'[t.getDay()]};
const visitRows=z=>K.filter(k=>z[k[0]]).map(k=>`<dt>${k[1]}</dt><dd>${esc(z[k[0]])}</dd>`).join('')+((z.fees||[]).length?`<dt>本次治疗</dt><dd>${z.fees.map(r=>esc(r.n)).filter(Boolean).join('、')}</dd><dt>本次治疗费用</dt><dd>${z.fees.map(r=>esc(r.n)+'　'+esc(r.a)).join('\n')}\n合计　${tot(z.fees)}</dd>`:'')+rxDetailsForVisit(z)+(z.fu?`<dt class="fu">复诊预约</dt><dd class="fu">${fuTxt(z.fu)}</dd>`:'');
function rxDetailsForVisit(z){
 if(typeof RX==='undefined')return '';
 const records=RX.filter(r=>r.visit_id===z.id&&!r.cancelled_at);
 if(!records.length)return '';
 return records.map(r=>{
  const lines=(Array.isArray(r.items)?r.items:[]).map(it=>{
   const id=String(it.id??it.herb_id??'');
   const h=HERBS.find(h=>h.id===id);
   const name=h?.name||it.name||id||'未知复方';
   return '<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0"><span>'+esc(name)+'</span><strong style="white-space:nowrap;font-weight:500">'+esc(it.g??it.grams??'')+'g</strong></div>';
  });
  return '<dt>复方开药</dt><dd><div style="max-width:360px">'+
   (r.name&&r.name!=='复方'?'<div style="margin-bottom:5px;color:var(--mut)">'+esc(r.name)+'</div>':'')+
   lines.join('')+
   '<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:600">总计：'+esc(r.total_g??'')+'g</div></div></dd>';
 }).join('');
}
function rows(){
 if(!P.length)return '<p class="mut">还没有病人。点右上角「新增病人」开始。</p>';
 const q=S.q.trim().toLowerCase(),ps=P.filter(p=>!q||hay(p).includes(q));
 if(!ps.length)return '<p class="mut">没有符合的病人。可以试试姓名、电话、出生年份或病历里的文字。</p>';
 const ids=new Set(ps.map(p=>p.id)),pm=Object.fromEntries(P.map(p=>[p.id,p])),vl=V.filter(v=>ids.has(v.pid)).sort((a,b)=>b.date.localeCompare(a.date)||a.ts-b.ts),lim=S.lim||30;
 let out=/^\d{4}$/.test(q)?`<div class="yh">${q} 年出生，共 ${ps.length} 人</div>`:'',cur='';
 for(const v of vl.slice(0,lim)){
  if(v.date!=cur){cur=v.date;const n=tot(V.filter(x=>x.date==cur).flatMap(x=>x.fees||[]));out+=`<div class="yh">${dayTxt(cur)}${+n?` <small class="mut">当天收入 ${n}</small>`:''}</div>`}
  const p=pm[v.pid]||{};
  out+=`<div class="card"><button class="pn" data-act="open" data-id="${v.pid}"><b>${esc(p.name||'')}</b> <small class="mut">${esc(p.gender||'')} ${yr(p)?yr(p)+' 年生':''} ${esc(p.occ||'')}</small></button><span class="tag ${v.type=='初诊'?'c':''}">${esc(v.type)}</span><dl class="kv" style="margin-top:8px">${visitRows(v)}</dl>${(v.ph||[]).length?`<p class="mut" style="margin:6px 0 0">照片 ${v.ph.length} 张（点名字查看）</p>`:''}</div>`}
 if(vl.length>lim)out+=`<button data-act="more" style="width:100%;margin-top:6px">显示更多（还有 ${vl.length-lim} 条）</button>`;
 const none=ps.filter(p=>!V.some(v=>v.pid==p.id)).sort(cmp);
 if(none.length)out+=`<div class="yh">还没有就诊记录的病人</div>`+none.map(p=>`<button class="row" data-act="open" data-id="${p.id}"><span><b>${esc(p.name)}</b> <small>${esc(p.gender||'')}</small> <span class="mut">${yr(p)?yr(p)+' 年生':''}</span></span></button>`).join('');
 return out}
const incCard=()=>{const d=today(),m=d.slice(0,7),td=V.filter(v=>v.date==d&&(v.fees||[]).length);return `<button class="row" data-act="inc"><span><b>今日收入</b> <small>${td.length} 位 · 本月 ${tot(V.filter(v=>v.date.startsWith(m)).flatMap(v=>v.fees||[]))}</small></span><b style="font-size:24px;color:var(--pine)">${tot(td.flatMap(v=>v.fees))}</b></button>`};
const SLOT=30,HRS=d=>{const w=new Date(d+'T00:00').getDay();return w==1||w==2?null:w==0?[[540,720]]:w==6?[[540,1020]]:[[540,720],[840,1020]]};
const ymd=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const t=new Date(d+'T00:00');t.setDate(t.getDate()+n);return ymd(t)};
const hm=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const fuTxt=a=>{const d=new Date(a.d+'T00:00');return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]+' '+a.t};
const appts=()=>P.flatMap(p=>{const z=vs(p.id)[0];return z&&z.fu?[{pid:p.id,name:p.name,...z.fu}]:[]});
const nextSlot=(from,pid)=>{const tk=appts().filter(a=>a.pid!==pid);let d=from;for(let i=0;i<200;i++,d=addDays(d,1)){const rs=HRS(d);if(!rs)continue;for(const h of rs)for(let m=h[0];m+SLOT<=h[1];m+=SLOT)if(!tk.some(a=>a.d==d&&a.t==hm(m)))return{d,t:hm(m)}}return{d:from,t:'09:00'}};
const nextAp=id=>{const a=appts().find(x=>x.pid==id);return a?`<p class="fu">下次复诊：${fuTxt(a)}</p>`:''};
const upcHTML=()=>{const u=appts().filter(a=>a.d>=today()).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)).slice(0,8);return u.length?`<div class="card"><b>近期复诊预约</b>${u.map(a=>`<button class="row" data-act="open" data-id="${a.pid}"><span><b>${esc(a.name)}</b></span><b>${fuTxt(a)}</b></button>`).join('')}</div>`:''};
const pdfBlocks=(p,ph=true)=>{const kv=(a,o)=>a.filter(f=>o[f[0]]).map(f=>`<dt>${f[1]}</dt><dd>${esc(o[f[0]])}</dd>`).join('');
 return [`<div class="pb"><h2>${esc(p.name)}</h2><dl>${kv(PF,p)}</dl></div>`,...vs(p.id).map(z=>`<div class="pb"><b>${z.date}　${esc(z.type)}</b><dl>${visitRows(z)}</dl>${ph?(z.ph||[]).map(x=>`<img src="${x}">`).join(''):''}</div>`)]};
async function buildPDF(blocks,name){
 if(!window.jspdf||!window.html2canvas){toast('PDF 组件没有载入，请检查网络后再试',5000);return}
 const prog=m=>{const t=document.getElementById('toast');t?t.textContent=m:toast(m,600000)};prog('正在生成 PDF，请稍等…');
 const root=document.createElement('div');root.style.cssText='position:fixed;left:-9999px;top:0;width:700px;background:#fff;color:#000;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
 root.innerHTML='<style>.pb{padding:12px 16px;border-bottom:1px solid #ccc;background:#fff}.pb h2{margin:0 0 8px;font-size:24px}.pb dl{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:6px 0 0}.pb dt{color:#555}.pb dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.pb img{width:200px;height:200px;object-fit:cover;margin:8px 8px 0 0}.pb .fu{color:#B8432F;font-weight:600}</style>'+blocks.join('');
 document.body.append(root);
 try{
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,H=297,M=10,cw=W-2*M,els=[...root.querySelectorAll('.pb')];let y=M;
  for(let i=0;i<els.length;i++){prog('正在生成 PDF '+(i+1)+' / '+els.length);
   const c=await html2canvas(els[i],{scale:2,backgroundColor:'#fff'}),h=c.height*cw/c.width;
   if(h<=H-2*M){if(y+h>H-M){pdf.addPage();y=M}pdf.addImage(c.toDataURL('image/jpeg',.85),'JPEG',M,y,cw,h);y+=h}
   else{if(y>M){pdf.addPage();y=M}const ph=(H-2*M)*c.width/cw;
    for(let sy=0;sy<c.height;sy+=ph){const sh=Math.min(ph,c.height-sy),t=document.createElement('canvas');t.width=c.width;t.height=sh;t.getContext('2d').drawImage(c,0,sy,c.width,sh,0,0,c.width,sh);if(sy>0){pdf.addPage();y=M}pdf.addImage(t.toDataURL('image/jpeg',.85),'JPEG',M,y,cw,sh*cw/c.width);y=M+sh*cw/c.width}}
  }
  const blob=pdf.output('blob');root.remove();document.getElementById('toast')?.remove();
  let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(x){}
  if(dl){try{await dl.save({filename:name,data:blob})}catch(x){if(!x||x.code!='declined')toast('保存失败')}return}
  const o=document.createElement('div');o.id='ov';
  o.innerHTML=`<div class="card" style="text-align:center;max-width:320px;margin:0 16px"><p style="margin-top:0"><b>PDF 已生成</b></p><a style="display:inline-block;padding:10px 18px;border-radius:8px;background:var(--pine);color:var(--onp);text-decoration:none" href="${URL.createObjectURL(blob)}" download="${esc(name)}">点此下载</a><div class="acts" style="justify-content:center"><button id="cl">关闭</button></div></div>`;
  o.querySelector('#cl').onclick=()=>o.remove();document.body.append(o)
 }catch(e){root.remove();document.getElementById('toast')?.remove();toast('生成失败：'+((e&&e.message)||'请重试'),5000)}
}
const exportPDF=()=>{const p=P.find(x=>x.id===S.id);buildPDF(pdfBlocks(p),p.name+'-病历-'+today()+'.pdf')};
const backupPDF=()=>buildPDF([`<div class="pb"><h2>病历备份</h2><p>${today()}　共 ${P.length} 位病人，${V.length} 条病例（不含照片）</p></div>`,...[...P].sort(cmp).flatMap(p=>pdfBlocks(p,false))],'病历备份-'+today()+'.pdf');
const exportJSON=async()=>{const json=JSON.stringify({v:1,patients:P,visits:V}),blob=new Blob([json],{type:'application/json'}),fn='病历恢复文件-'+today()+'.json';
 let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(x){}
 if(dl){try{await dl.save({filename:fn,data:blob})}catch(x){if(!x||x.code!='declined')toast('导出失败')}return}
 const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class="card" style="text-align:center;max-width:340px;margin:0 16px"><p style="margin-top:0"><b>恢复用文件已生成（${P.length} 位病人）</b></p><a style="display:inline-block;padding:10px 18px;border-radius:8px;background:var(--pine);color:var(--onp);text-decoration:none" href="${URL.createObjectURL(blob)}" download="${esc(fn)}">点此下载</a><div class="acts" style="justify-content:center"><button id="cp">复制文字</button><button id="cl">关闭</button></div><p class="mut" style="font-size:13px;margin-bottom:0">下载不了的话，点「复制文字」，再粘贴到手机备忘录保存。</p></div>`;
 o.querySelector('#cl').onclick=()=>o.remove();o.querySelector('#cp').onclick=()=>navigator.clipboard.writeText(json).then(()=>toast('已复制'),()=>toast('复制失败，请改用下载'));document.body.append(o)};
const incHTML=()=>{const d=S.d||today(),m=d.slice(0,7),rows=V.filter(v=>v.date==d&&(v.fees||[]).length).sort((a,b)=>a.ts-b.ts),byDay={};
 V.filter(v=>v.date.startsWith(m)).forEach(v=>(v.fees||[]).forEach(r=>{byDay[v.date]=(byDay[v.date]||0)+(parseFloat(r.a)||0)}));
 const days=Object.keys(byDay).sort().reverse();
 return `<div class="top"><button data-act="back">返回</button><h2>每日收入</h2></div>

 pinfn=async k=>{if(!locked)return;if(k=='⌫')cur=cur.slice(0,-1);else if(cur.length<4)cur+=k;pad();
  if(cur.length<4)return;const x=await hash(cur);

}

function cloudHeaders(){return {'apikey':CC.key,'Authorization':'Bearer '+(CC.session?.access_token||CC.key),'Content-Type':'application/json'}}
async function cloudFetch(path,options={}){if(!navigator.onLine)throw Error('当前离线，云端资料无法保存');const res=await fetch(CC.url+path,{...options,headers:{...cloudHeaders(),...(options.headers||{})}});const raw=await res.text();let value;try{value=raw?JSON.parse(raw):null}catch{value=raw}if(!res.ok)throw Error(value?.message||value?.error_description||value?.error||'服务器错误 '+res.status);return value}
async function cloudAuthRefresh(){if(!CC.session?.refresh_token)throw Error('请重新登录');const x=await fetch(CC.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CC.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:CC.session.refresh_token})});const r=await x.json();if(!x.ok)throw Error('登录已过期');CC.session=r;sessionStorage.setItem('renkangCloudSession',JSON.stringify(r))}
async function cloudRequest(path,options={}){try{return await cloudFetch(path,options)}catch(e){if(/JWT expired|invalid JWT|token is expired/i.test(e.message)){await cloudAuthRefresh();return cloudFetch(path,options)}throw e}}

async function cloudPut(s,v){await cloudRequest('/rest/v1/'+which(s),{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(s==='patients'?{id:v.id,data:v}:{id:v.id,pid:v.pid,data:v})});return v.id}
async function cloudDelete(s,id){if(s==='visits'){if(RX.some(r=>!r.cancelled_at&&r.visit_id===id))throw Error('请先撤销此病例的发药记录')}if(s==='patients'){const visits=V.filter(v=>v.pid===id);if(RX.some(r=>!r.cancelled_at&&visits.some(v=>v.id===r.visit_id)))throw Error('请先撤销病人的所有发药记录')}await cloudRequest('/rest/v1/'+which(s)+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
async function rpc(name,args){return cloudRequest('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)})}
async function stockReload(){[HERBS,RX,QUOTES]=await Promise.all([cloudRequest('/rest/v1/herbs?select=*&order=name&limit=10000'),cloudRequest('/rest/v1/prescriptions?select=*&order=created_at.desc&limit=10000'),cloudRequest('/rest/v1/herb_quotes?select=*&limit=10000')])}
// A four-digit PIN is verified by the server-side Edge Function, never locally.
async function cloudPinCall(action,pin,setupCode=''){
 const res=await fetch(CC.url+'/functions/v1/renkang-pin-auth',{method:'POST',headers:{'Content-Type':'application/json','apikey':CC.key},body:JSON.stringify({action,pin,setupCode})});
 const x=await res.json().catch(()=>({}));if(!res.ok)throw Error(x.error||'无法验证 PIN');return x;
}
async function cloudPinLogin(pin,setupCode=''){
 const x=await cloudPinCall(setupCode?'setup':'login',pin,setupCode);
 if(!x.session?.access_token||!x.session?.refresh_token)throw Error('服务器没有返回登录资料');
 CC.session=x.session;sessionStorage.setItem('renkangCloudSession',JSON.stringify(x.session));
 await stockReload();await start();
}

function renderMix(){const host=$el('mixLines');if(!host)return;host.innerHTML=STOCK_LINES.map((r,i)=>`<div class="card" style="padding:10px"><label>药粉 ${i+1}<select data-h="${i}"><option value="">请选择药粉</option>${HERBS.map(h=>`<option value="${esc(h.id)}" ${h.id===r.id?'selected':''}>${esc(h.name)} (${h.qty}g)</option>`).join('')}</select></label><label>克数 (g)<input type="number" min="0.01" step="0.01" data-g="${i}" value="${esc(r.g)}"></label><button data-remove="${i}">移除</button></div>`).join('');host.querySelectorAll('[data-h]').forEach(x=>x.onchange=()=>{STOCK_LINES[+x.dataset.h].id=x.value;updateMix()});host.querySelectorAll('[data-g]').forEach(x=>x.oninput=()=>{STOCK_LINES[+x.dataset.g].g=x.value;updateMix()});host.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{STOCK_LINES.splice(+x.dataset.remove,1);if(!STOCK_LINES.length)STOCK_LINES.push({id:'',g:''});renderMix()});updateMix()}
function mixValid(){let t=0;const ids=new Set();for(const x of STOCK_LINES){const h=HERBS.find(y=>y.id===x.id),g=Number(x.g);if(!h)return {error:'请选择全部药粉'};if(ids.has(x.id))return{error:'同一药粉请合并为一行'};ids.add(x.id);if(!Number.isFinite(g)||g<=0||roundG(g)!==g)return{error:'请输入有效克数（最多两位小数）'};if(g>Number(h.qty))return{error:h.name+' 库存不足'};t=roundG(t+g)}return {total:t}}
function updateMix(){const x=mixValid();$el('mixTotal').innerHTML=`<b>混合重量：${x.total??roundG(STOCK_LINES.reduce((n,r)=>n+(Number(r.g)||0),0))}g</b><p class="mut">${esc(x.error||'库存充足，可以发药')}</p>`;$el('confirmMix').disabled=!!x.error}

async function seedCloud(){
 if(!confirm('把照片整理出的复方目录及 HENDA、TIMING 供应商报价同步到云端？同名复方不重复建立；保留已有库存数量。'))return;
 const button=$el('seedStock');if(button){button.disabled=true;button.textContent='正在同步复方与报价…'}
 try{
  await stockReload();
  const byName=new Map(HERBS.map(h=>[h.name.trim(),h]));
  const incoming=CAT.filter(h=>!byName.has(h.name.trim())).map((h,i)=>({id:'compound-'+h.sku,name:h.name,sku:h.sku,qty:400}));
  for(let i=0;i<incoming.length;i+=100)await cloudRequest('/rest/v1/herbs',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(incoming.slice(i,i+100))});
  await stockReload();
  const lookup=new Map(HERBS.map(h=>[h.name.trim(),h]));
  const quotes=[];
  for(const h of CAT){const herb=lookup.get(h.name.trim());if(!herb)throw Error('找不到复方：'+h.name);
   for(const [supplier,o] of Object.entries(h.offers||{})){if(!Number.isFinite(Number(o.price))||Number(o.price)<=0)continue;
    quotes.push({id:'compound-'+herb.id+'-'+supplier,herb_id:herb.id,supplier,price:Number(o.price),pack_grams:200,sku:o.sku||''});
   }
  }
  for(let i=0;i<quotes.length;i+=100)await cloudRequest('/rest/v1/herb_quotes',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(quotes.slice(i,i+100))});
  await stockReload();stockDashboard();alert('已同步复方目录（共 '+CAT.length+' 种）和 '+quotes.length+' 条有效供应商报价。同名复方合并展示最低价格；已有库存未重置。');
 }catch(e){alert('复方同步失败：'+e.message)}finally{if(button){button.disabled=false;button.textContent='同步全部复方及最低报价'}}
}
async function setAllCompoundStock400(){
 await stockReload();
 const names=new Set(CAT.map(h=>h.name.trim()));
 const selected=HERBS.filter(h=>names.has(h.name.trim()));
 if(!selected.length)return alert('尚未有复方药粉，请先点击「同步全部复方及最低报价」。');
 if(!confirm('确定将全部 '+selected.length+' 种复方的库存统一设置为 400g（2瓶）？这会覆盖原有库存数量，无法自动撤销；不影响病历和报价。'))return;
 const btn=$el('setAll400');if(btn){btn.disabled=true;btn.textContent='正在设置库存…'}
 let done=0;
 try{
  for(const h of selected){await rpc('adjust_herb',{p_herb_id:h.id,p_new_qty:400,p_unit_cost:h.unit_cost,p_name:h.name,p_sku:h.sku});done++}
  await stockReload();stockDashboard();alert('成功！已将 '+done+' 种复方库存设为 400g（2瓶）。');
 }catch(e){await stockReload();stockDashboard();alert('更新中断，已完成 '+done+'/'+selected.length+' 种。请检查库存后重试。错误：'+e.message)}
 finally{if(btn){btn.disabled=false;btn.textContent='全部复方设为 400g（2瓶）'}}
}
function stockDashboard(){go('list');let root=wrapModal('🌿 StockBase 云端库存',`<div class="acts"><button id="seedStock">同步全部复方及最低报价</button><button id="setAll400">全部复方设为 400g（2瓶）</button><button id="migrateLocal" disabled title="需要安全迁移方案，暂不开放">旧库存迁移（待核对）</button><input id="stockFile" type="file" accept=".json" hidden></div><label>药粉搜索<input id="herbSearch" type="search" placeholder="输入名称或编号"></label><div id="herbRows"></div><h2>每月药粉用量</h2><label>选择月份<input type="month" id="usageMonth" value="${today().slice(0,7)}"></label><div id="monthlyRows"></div>`);root.querySelector('#seedStock').onclick=seedCloud;root.querySelector('#setAll400').onclick=setAllCompoundStock400;root.querySelector('#migrateLocal').onclick=()=>root.querySelector('#stockFile').click();root.querySelector('#stockFile').onchange=async e=>{const f=e.target.files[0];if(f)await migrateStockFile(f)};root.querySelector('#herbSearch').oninput=renderStock;root.querySelector('#usageMonth').onchange=renderStock;renderStock()}
function packText(g){const n=Math.round(Number(g)*100),p=Math.floor(n/20000),r=roundG((n%20000)/100);return p?p+'罐'+(r?' '+r+'g':''):r+'g'}
function renderStock(){const root=$el('cloudModal');if(!root)return;const q=$el('herbSearch')?.value.trim().toLowerCase()||'';$el('herbRows').innerHTML=HERBS.filter(h=>!q||(h.name+' '+h.sku).toLowerCase().includes(q)).slice(0,160).map(h=>`<div class="row" style="display:flex;gap:8px"><span><b>${esc(h.name)}</b><small>${esc(h.sku)} · ${h.qty}g ${Number(h.qty)<=400?'⚠ 低库存':''} · ${(()=>{const qs=QUOTES.filter(q=>q.herb_id===h.id);if(!qs.length)return '暂无报价';const best=qs.map(q=>({supplier:q.supplier,price:roundG(q.price*200/q.pack_grams)})).sort((a,b)=>a.price-b.price)[0];return '最低报价 '+esc(best.supplier)+' RM'+best.price+'/200g'})()}</small></span><button type="button" data-editstock="${esc(h.id)}">盘点</button></div>`).join('')||'<p>暂无药粉，请先导入目录</p>';const month=$el('usageMonth').value;const used=new Map();for(const r of RX.filter(r=>!r.cancelled_at&&r.created_at.slice(0,7)===month))for(const it of r.items){used.set(it.id,roundG((used.get(it.id)||0)+Number(it.g)))}$el('monthlyRows').innerHTML=[...used].sort((a,b)=>b[1]-a[1]).map(([id,g])=>`<div class="row"><b>${esc(HERBS.find(h=>h.id===id)?.name||id)}</b><b>${packText(g)}</b></div>`).join('')||'<p class="mut">这个月还没有开药记录</p>';root.querySelectorAll('[data-editstock]').forEach(b=>b.onclick=()=>editStock(b.dataset.editstock))}
async function editStock(id){const h=HERBS.find(x=>x.id===id);const val=prompt(h.name+'：请输入盘点后的实际库存 (g)',h.qty);if(val===null)return;const qty=Number(val);if(!Number.isFinite(qty)||qty<0||roundG(qty)!==qty)return alert('请输入有效库存 (g)');try{await rpc('adjust_herb',{p_herb_id:id,p_new_qty:qty,p_unit_cost:h.unit_cost,p_name:h.name,p_sku:h.sku});await stockReload();renderStock()}catch(e){alert('更新失败：'+e.message)}}
async function migrateStockFile(file){try{if(HERBS.length)throw Error('请在全新空数据库中迁移 StockBase，以防覆盖库存');const raw=JSON.parse(await file.text()),d=raw.data||raw;if(!Array.isArray(d.herbs))throw Error('这不是 StockBase 备份');if(!confirm('将旧药粉、库存和报价导入空的云端数据库？历史开药需另行核对。'))return;const hs=d.herbs.map(h=>({id:String(h.id),name:h.name,sku:h.sku||'',qty:Math.max(0,Number(h.qty)||0),unit_cost:h.unitCost??null}));for(let i=0;i<hs.length;i+=100)await cloudRequest('/rest/v1/herbs',{method:'POST',body:JSON.stringify(hs.slice(i,i+100))});const quotes=(d.quotes||[]).filter(q=>hs.some(h=>h.id===q.herbId)).map(q=>({id:String(q.id),herb_id:q.herbId,supplier:d.suppliers?.find(s=>s.id===q.supplierId)?.name||q.supplierId,price:Number(q.price)||0,pack_grams:Number(q.packGrams)||200,sku:q.sku||''}));for(let i=0;i<quotes.length;i+=100)await cloudRequest('/rest/v1/herb_quotes',{method:'POST',body:JSON.stringify(quotes.slice(i,i+100))});await stockReload();stockDashboard();alert('库存和报价已导入。注意：旧版历史开药记录尚未迁移到月用量统计，不要重复补扣。')}catch(e){alert('库存迁移失败：'+e.message)}}

importData=async function(t){if(!confirm('确定将旧病历备份合并进云端？相同 ID 的病人/病例将被更新。请先备份。'))return;await originalImportData(t)};

cloudGate();
