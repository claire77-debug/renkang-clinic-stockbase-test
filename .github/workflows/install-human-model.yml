name: Install verified high-detail human model
on:
  push:
    paths:
      - '.github/workflows/install-human-model.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public domain MakeHuman model
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
          python - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          url='https://www.innerscene.com/tools/library/3d-parts/male-base-mesh-3d-person-rigged-a-pose-380e6d89'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(accept_downloads=True)
              await page.goto(url,wait_until='domcontentloaded',timeout=90000)
              async with page.expect_download(timeout=90000) as download_info:
                await page.get_by_text('Download GLB',exact=True).first.click()
              download=await download_info.value
              os.makedirs('models',exist_ok=True)
              path='models/male-base-mesh-base_male.glb'
              await download.save_as(path)
              with open(path,'rb') as f: signature=f.read(4)
              assert signature==b'glTF', 'Invalid GLB signature'
              assert os.path.getsize(path)>1000000, 'Unexpectedly small asset'
              print('Downloaded verified GLB',os.path.getsize(path))
              await browser.close()
          asyncio.run(main())
          PY
      - name: Commit GLB only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/male-base-mesh-base_male.glb
          git diff --cached --quiet || (git commit -m "Add user-selected high detail CC0 model" && git push)
