<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>3D 人体疼痛标记</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft Yahei",sans-serif;color:#25433a;background:#f5f7f3}header{padding:12px 14px;background:white;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce6df}h1{font-size:17px;margin:0}button,select,input{font:inherit}button{border:1px solid #cbdcd1;border-radius:10px;background:white;padding:10px 11px;color:#244b40}button.on,.primary{background:#266454;color:white;border-color:#266454}.toolbar{display:flex;gap:6px;overflow:auto;padding:9px;background:white;scrollbar-width:none}.toolbar button{white-space:nowrap;font-size:13px}.stage{position:relative;height:min(66vh,530px);min-height:320px;background:radial-gradient(#fafcfb,#d5e7e3);overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;background:#ffffffbd;border-radius:8px;font-size:12px;padding:7px;pointer-events:none}.status{position:absolute;top:10px;left:10px;background:#fffde9d9;padding:6px 10px;border-radius:10px;font-size:12px}.panel{padding:12px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}label{font-size:13px;display:grid;gap:5px}input,select,textarea{border:1px solid #c7d8cd;border-radius:9px;padding:10px;background:white;color:#234339;width:100%;font:inherit}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tags button{font-size:12px;padding:7px 9px}.list{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.list button{font-size:12px;padding:7px 9px}.footer{padding:12px;display:flex;gap:9px;background:#fff;position:sticky;bottom:0;box-shadow:0 -2px 12px #0001}.footer button{flex:1}.muted{font-size:12px;color:#718479}.chosen{font-size:12px;margin-top:10px;padding:9px;border-radius:9px;background:#edf4ed}.error{padding:18px;color:#9a432d;text-align:center} </style>
</head><body><header><h1>人体疼痛位置 · 3D</h1><button id="close">关闭</button></header>
<div class="toolbar" id="modes"><button data-mode="rotate" class="on">↻ 旋转 / 缩放</button><button data-mode="point">● 点选</button><button data-mode="circle">◯ 画圈</button><button data-mode="draw">✎ 自由画笔</button><button id="undo">↶ 撤销</button></div>
<div class="stage" id="stage"><div class="status" id="status">正在载入人体模型…</div><div class="hint" id="hint">单指旋转 · 双指缩放 · 切换标记工具后触摸人体</div></div>
<div class="toolbar"><button id="front">正面</button><button id="left">左侧</button><button id="back">背面</button><button id="right">右侧</button><button id="reset">重设角度</button></div>
<div class="panel">
<div class="grid"><label>身体区域<select id="region"></select></label><label>左右<select id="side"><option>左侧</option><option>右侧</option><option>双侧</option><option selected>中央</option><option>不确定</option></select></label></div>
<div id="parts" class="list"></div><label style="margin-top:12px">疼痛程度（0–10 分）<input type="range" id="severity" min="0" max="10" value="5"></label><div class="muted" id="sv">疼痛程度：5 / 10</div>
<div class="tags" id="kinds"></div><label>描述（选填）<textarea rows="2" id="notes" placeholder="例如：右侧肩胛下缘酸痛，抬手时加重"></textarea></label>
<div class="chosen" id="summary">尚未标记。</div><p class="muted">部位列表用于辅助记录；精确位置以人体上的标记为准。模型为外观示意，不用于解剖诊断。</p></div>
<div class="footer"><button id="clear">清除</button><button class="primary" id="save">保存疼痛记录</button></div>

function readGLB(base64){const buffer=decode64(base64),view=new DataView(buffer);if(view.getUint32(0,true)!==0x46546c67)throw Error('模型数据文件不完整');let off=12,j=null,bin=0;while(off<buffer.byteLength){const n=view.getUint32(off,true),kind=view.getUint32(off+4,true);if(kind===0x4e4f534a){j=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,off+8,n)))}if(kind===0x004e4942)bin=off+8;off+=8+n}if(!j||!bin)throw Error('模型缺少几何数据');const prim=j.meshes[0].primitives[0];function accessor(id){const a=j.accessors[id],b=j.bufferViews[a.bufferView],at=bin+(b.byteOffset||0)+(a.byteOffset||0),count=a.count,components=a.type==='VEC3'?3:a.type==='VEC2'?2:1,bytes=a.componentType===5126?4:a.componentType===5125?4:2,step=b.byteStride||components*bytes,d=new DataView(buffer);const out=[];for(let i=0;i<count;i++)for(let k=0;k<components;k++){const p=at+i*step+k*bytes;out.push(a.componentType===5126?d.getFloat32(p,true):a.componentType===5125?d.getUint32(p,true):d.getUint16(p,true))}return out}
const p=accessor(prim.attributes.POSITION),idx=accessor(prim.indices),n=prim.attributes.NORMAL!==undefined?accessor(prim.attributes.NORMAL):null;
let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(let i=0;i<p.length;i+=3)for(let k=0;k<3;k++){min[k]=Math.min(min[k],p[i+k]);max[k]=Math.max(max[k],p[i+k])}
const dims=max.map((x,k)=>x-min[k]);axis=dims.indexOf(Math.max(...dims));modelScale=1.8/Math.max(...dims);modelCentre=min.map((x,k)=>(x+max[k])/2);
const verts=new Float32Array(idx.length*6);for(let i=0;i<idx.length;i++){const ix=idx[i]*3;let v=[p[ix]-modelCentre[0],p[ix+1]-modelCentre[1],p[ix+2]-modelCentre[2]];let norm=n?[n[ix],n[ix+1],n[ix+2]]:[0,0,1];if(axis===2){v=[v[0],v[2],-v[1]];norm=[norm[0],norm[2],-norm[1]]}else if(axis===0){v=[v[1],v[0],v[2]];norm=[norm[1],norm[0],norm[2]]}for(let k=0;k<3;k++){verts[i*6+k]=v[k]*modelScale;verts[i*6+3+k]=norm[k]}}const unique=[];for(let i=0;i<p.length;i+=3){let v=[p[i]-modelCentre[0],p[i+1]-modelCentre[1],p[i+2]-modelCentre[2]];if(axis===2)v=[v[0],v[2],-v[1]];else if(axis===0)v=[v[1],v[0],v[2]];unique.push(v.map(a=>a*modelScale))}return{verts,unique}}
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let program,attrib,uYaw,uPitch,uDist,uAspect;
function init(geo){geometry=geo;gl=canvas.getContext('webgl',{antialias:true,alpha:true})||canvas.getContext('experimental-webgl');if(!gl)throw Error('浏览器没有开启 WebGL 硬件绘图');let vs=shader(gl.VERTEX_SHADER,'attribute vec3 pos;attribute vec3 normal;uniform float yaw;uniform float pitch;uniform float distance;uniform float aspect;varying vec3 vNormal;void main(){float cy=cos(yaw),sy=sin(yaw),cx=cos(pitch),sx=sin(pitch);vec3 p=vec3(cy*pos.x+sy*pos.z,pos.y,-sy*pos.x+cy*pos.z);p=vec3(p.x,cx*p.y-sx*p.z,sx*p.y+cx*p.z);vec3 n=vec3(cy*normal.x+sy*normal.z,normal.y,-sy*normal.x+cy*normal.z);vNormal=normalize(vec3(n.x,cx*n.y-sx*n.z,sx*n.y+cx*n.z));float depth=max(.5,distance-p.z);gl_Position=vec4(p.x*1.9/aspect,p.y*1.9,depth*.08,depth*.53);}');
let fs=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 vNormal;void main(){vec3 n=normalize(vNormal);float light=.52+.34*max(dot(n,normalize(vec3(-.45,.75,.7))),0.0)+.15*max(dot(n,normalize(vec3(.6,.2,-.6))),0.0);float rim=pow(1.0-max(dot(n,vec3(0.0,0.0,1.0)),0.0),2.0);vec3 skin=vec3(.84,.61,.49);vec3 c=skin*(.53+.49*max(dot(n,normalize(vec3(-.35,.65,.75))),0.0));c*=1.0-.27*rim;gl_FragColor=vec4(c,1.0);}');program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,geo.verts,gl.STATIC_DRAW);for(const [name,offset] of [['pos',0],['normal',12]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset)}uYaw=gl.getUniformLocation(program,'yaw');uPitch=gl.getUniformLocation(program,'pitch');uDist=gl.getUniformLocation(program,'distance');uAspect=gl.getUniformLocation(program,'aspect');gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);gl.frontFace(gl.CCW);gl.cullFace(gl.BACK);loaded=true;status.textContent='3D 人体已载入';setTimeout(()=>status.style.display='none',1800);resize();requestAnimationFrame(frame)}
function project(v){let cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);let x=cy*v[0]+sy*v[2],z=-sy*v[0]+cy*v[2],y=cx*v[1]-sx*z;z=sx*v[1]+cx*z;let d=Math.max(.5,dist-z);return [(x*1.9/(canvas.width/canvas.height)/(.53*d)+1)*canvas.width/2,(1-y*1.9/(.53*d))*canvas.height/2,d]}
function drawOver(){ctx.clearRect(0,0,overlay.width,overlay.height);ctx.lineWidth=3*devicePixelRatio;ctx.strokeStyle='#d73528';ctx.fillStyle='#db3e2b78';for(const mark of data.marks){const pts=mark.points.map(project);if(!pts.length)continue;if(mark.type==='point'){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],8*devicePixelRatio,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(mark.type==='circle'){const p=pts[0],q=pts[1]||p;ctx.beginPath();ctx.ellipse((p[0]+q[0])/2,(p[1]+q[1])/2,Math.max(9,Math.abs(p[0]-q[0])/2),Math.max(9,Math.abs(p[1]-q[1])/2),0,0,Math.PI*2);ctx.stroke()}else{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}}}
function frame(){if(!loaded)return;const w=canvas.width,h=canvas.height;gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniform1f(uYaw,yaw);gl.uniform1f(uPitch,pitch);gl.uniform1f(uDist,dist);gl.uniform1f(uAspect,w/h);gl.drawArrays(gl.TRIANGLES,0,geometry.verts.length/6);drawOver();requestAnimationFrame(frame)}
function resize(){const ratio=Math.min(devicePixelRatio||1,2);canvas.width=overlay.width=Math.max(1,Math.round(stage.clientWidth*ratio));canvas.height=overlay.height=Math.max(1,Math.round(stage.clientHeight*ratio));if(loaded)gl.viewport(0,0,canvas.width,canvas.height)}new ResizeObserver(resize).observe(stage);
function nearest(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*canvas.width,y=(e.clientY-rect.top)/rect.height*canvas.height;let best=null,score=Infinity;for(const v of geometry.unique){const p=project(v),d=(p[0]-x)**2+(p[1]-y)**2,sc=d+p[2]*3;if(sc<score){score=sc;best=v}}return score<Math.pow(canvas.width*.13,2)?best:null}
function renderParts(){partList.replaceChildren();for(const p of regions[region.value].split(',')){const b=document.createElement('button');const value=$('side').value+' · '+p;b.textContent=p;b.className=data.areas.includes(value)?'on':'';b.onclick=()=>{data.areas.includes(value)?data.areas=data.areas.filter(x=>x!==value):data.areas.push(value);renderParts();summary()};partList.append(b)}}
region.onchange=renderParts;$('side').onchange=renderParts;
['酸痛','刺痛','胀痛','钝痛','灼痛','麻木','牵拉痛','放射痛','跳痛','压痛'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{data.kinds.includes(t)?data.kinds=data.kinds.filter(x=>x!==t):data.kinds.push(t);b.classList.toggle('on',data.kinds.includes(t));summary()};$('kinds').append(b)});
function summary(){$('summary').textContent='标记 '+data.marks.length+' 处 / 选择 '+data.areas.length+' 个部位'+(data.areas.length?'：'+data.areas.join('、'):'')+'；程度 '+data.severity+'/10'}
$('severity').oninput=()=>{data.severity=+$('severity').value;$('sv').textContent='疼痛程度：'+data.severity+'/10';summary()};$('notes').oninput=()=>data.notes=$('notes').value;
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('hint').textContent=m==='rotate'?'单指旋转 · 双指缩放':m==='point'?'点击人体留下红色痛点':m==='circle'?'按住拖动圈出疼痛范围':'按住拖动绘制疼痛路线'}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
let touches=new Map();
canvas.addEventListener('pointerdown',e=>{if(!loaded)return;canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(mode!=='rotate'){const p=nearest(e);gesture=p?{id:e.pointerId,pts:[p]}:null}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const last=touches.get(e.pointerId),dx=e.clientX-last.x,dy=e.clientY-last.y;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(mode==='rotate'){if(touches.size===1){yaw+=dx*.009;pitch=Math.max(-.55,Math.min(.55,pitch+dy*.006))}else if(touches.size>=2)dist=Math.min(7,Math.max(2,dist-dy*.012))}else if(gesture?.id===e.pointerId){const p=nearest(e);if(p){if(mode==='draw')gesture.pts.push(p);else if(mode==='circle')gesture.pts[1]=p}}});
function up(e){touches.delete(e.pointerId);if(gesture?.id===e.pointerId){if(mode==='circle'&&gesture.pts.length<2)gesture.pts.push(gesture.pts[0].map((n,i)=>n+(i===0?.07:0)));data.marks.push({type:mode,points:gesture.pts});gesture=null;summary()}}canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function angle(a){yaw=a;pitch=0;setMode('rotate')}$('front').onclick=()=>angle(0);$('back').onclick=()=>angle(Math.PI);$('left').onclick=()=>angle(-Math.PI/2);$('right').onclick=()=>angle(Math.PI/2);$('reset').onclick=()=>{angle(0);dist=3.8};
$('undo').onclick=()=>{data.marks.pop();summary()};$('clear').onclick=()=>{if(!confirm('清除所有疼痛标记？'))return;data={marks:[],areas:[],severity:5,kinds:[],notes:''};$('notes').value='';$('severity').value=5;renderParts();summary()};
function receiver(){return window.opener||((window.parent!==window)?window.parent:null)}
$('save').onclick=()=>{data.notes=$('notes').value;const r=receiver();if(r){r.postMessage({type:'renkang-pain-save',payload:JSON.stringify(data)},location.origin);if(window.opener)setTimeout(()=>window.close(),180)}else{localStorage.setItem('renkang-pain-demo',JSON.stringify(data));alert('演示记录已保存')}};$('close').onclick=()=>{const r=receiver();if(r){r.postMessage({type:'renkang-pain-close'},location.origin);window.close()}else history.back()};
function receive(v){try{const d=JSON.parse(v);if(d&&Array.isArray(d.marks)&&Array.isArray(d.areas)){data=d;$('notes').value=d.notes||'';$('severity').value=d.severity??5;renderParts();summary()}}catch{}}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='renkang-pain-init')receive(e.data.payload)});
if(window.opener)window.opener.postMessage({type:'renkang-pain-ready'},location.origin);
try{status.textContent='正在解析内置 3D 人体…';const geom=readGLB(EMBEDDED_MODEL);init(geom)}catch(e){status.textContent='加载失败：'+e.message;console.error(e)}
renderParts();summary();
