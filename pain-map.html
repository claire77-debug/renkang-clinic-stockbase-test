<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>3D 人体疼痛标记</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft Yahei",sans-serif;color:#25433a;background:#f5f7f3}header{padding:12px 14px;background:white;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce6df}h1{font-size:17px;margin:0}button,select,input{font:inherit}button{border:1px solid #cbdcd1;border-radius:10px;background:white;padding:10px 11px;color:#244b40}button.on,.primary{background:#266454;color:white;border-color:#266454}.toolbar{display:flex;gap:6px;overflow:auto;padding:9px;background:white;scrollbar-width:none}.toolbar button{white-space:nowrap;font-size:13px}.stage{position:relative;height:min(66vh,530px);min-height:320px;background:radial-gradient(#fafcfb,#d5e7e3);overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;background:#ffffffbd;border-radius:8px;font-size:12px;padding:7px;pointer-events:none}.status{position:absolute;top:10px;left:10px;background:#fffde9d9;padding:6px 10px;border-radius:10px;font-size:12px}.panel{padding:12px 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}label{font-size:13px;display:grid;gap:5px}input,select,textarea{border:1px solid #c7d8cd;border-radius:9px;padding:10px;background:white;color:#234339;width:100%;font:inherit}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tags button{font-size:12px;padding:7px 9px}.list{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.list button{font-size:12px;padding:7px 9px}.footer{padding:12px;display:flex;gap:9px;background:#fff;position:sticky;bottom:0;box-shadow:0 -2px 12px #0001}.footer button{flex:1}.muted{font-size:12px;color:#718479}.chosen{font-size:12px;margin-top:10px;padding:9px;border-radius:9px;background:#edf4ed}.error{padding:18px;color:#9a432d;text-align:center} </style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script></head><body><header><h1>人体疼痛位置 · 3D</h1><button id="close">关闭</button></header>
<div class="toolbar" id="modes"><button data-mode="rotate" class="on">↻ 旋转 / 缩放</button><button data-mode="point">● 点选</button><button data-mode="circle">◯ 画圈</button><button data-mode="draw">✎ 自由画笔</button><button id="undo">↶ 撤销</button></div>
<div class="stage" id="stage"><model-viewer id="person" camera-controls interaction-prompt="none" shadow-intensity="1" exposure="1.1" environment-image="neutral" camera-orbit="0deg 90deg 3.8m" style="position:absolute;inset:0;width:100%;height:100%;background:transparent"></model-viewer><canvas id="paint" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas><div class="status" id="status">请点击「选择高精度模型文件」首次导入，之后本设备自动读取</div><div style="position:absolute;top:47px;left:10px;z-index:4"><button id="uploadBtn">选择高精度模型文件 (.glb)</button><input id="modelInput" type="file" accept=".glb,model/gltf-binary" hidden></div><div class="hint" id="hint">单指旋转 · 双指缩放 · 切换标记工具后触摸人体</div></div>
<div class="toolbar"><button id="front">正面</button><button id="left">左侧</button><button id="back">背面</button><button id="right">右侧</button><button id="reset">重设角度</button></div>
<div class="panel">
<div class="grid"><label>身体区域<select id="region"></select></label><label>左右<select id="side"><option>左侧</option><option>右侧</option><option>双侧</option><option selected>中央</option><option>不确定</option></select></label></div>
<div id="parts" class="list"></div><label style="margin-top:12px">疼痛程度（0–10 分）<input type="range" id="severity" min="0" max="10" value="5"></label><div class="muted" id="sv">疼痛程度：5 / 10</div>
<div class="tags" id="kinds"></div><label>描述（选填）<textarea rows="2" id="notes" placeholder="例如：右侧肩胛下缘酸痛，抬手时加重"></textarea></label>
<div class="chosen" id="summary">尚未标记。</div><p class="muted">部位列表用于辅助记录；精确位置以人体上的标记为准。模型为外观示意，不用于解剖诊断。</p></div>
<div class="footer"><button id="clear">清除</button><button class="primary" id="save">保存疼痛记录</button></div>
<script>window.addEventListener('error',e=>{const t=document.getElementById('status');if(t&&t.textContent.includes('正在载入'))t.textContent='脚本错误：'+(e.message||'未知错误')});window.addEventListener('unhandledrejection',e=>{const t=document.getElementById('status');if(t&&t.textContent.includes('正在载入'))t.textContent='组件加载错误：'+(e.reason?.message||String(e.reason))});setTimeout(()=>{const t=document.getElementById('status');if(t&&t.textContent.includes('正在载入'))t.textContent='3D 组件未成功启动（请截图此提示）'},7000)</script><script>
const $=id=>document.getElementById(id),viewer=$('person'),paint=$('paint'),ctx=paint.getContext('2d');
const regions={
'头部与脸部':'头顶,额头,太阳穴,后脑,头皮,眼眶,眼睛,耳朵,耳后,鼻子,鼻窦,颧骨,脸颊,上下颌,牙齿,下巴,口腔',
'颈部／咽喉':'前颈,后颈,左侧颈,右侧颈,颈椎,颈根部,喉咙,锁骨上窝',
'肩／手臂':'肩峰,肩关节,锁骨,三角肌,腋下,上臂前侧,上臂后侧,上臂内侧,上臂外侧,肘内侧,肘外侧,肘窝,鹰嘴,前臂前侧,前臂后侧,手腕内侧,手腕外侧',
'手部／手指':'手背,手掌,大鱼际,小鱼际,掌指关节,拇指,食指,中指,无名指,小指,指尖,指间关节',
'胸部／肋骨':'胸骨,胸骨旁,左胸,右胸,乳房区域,胸大肌,肋骨前侧,侧胸,肋间,肋缘',
'腹部':'上腹,胃脘,剑突下,肚脐,脐周,左上腹,右上腹,左下腹,下腹中央,侧腹,腹股沟',
'背部／脊椎':'后颈,上背,中背,下背,颈椎,胸椎,腰椎,肩胛上角,肩胛内缘,肩胛下角,左肩胛,右肩胛,脊柱旁,腰骶交界,骶骨,尾骨',
'腰／臀／骨盆':'左腰,右腰,腰两侧,腰眼,髂嵴,骶髂关节,髋前侧,髋外侧,髋后侧,左臀,右臀,臀中部,坐骨,耻骨,会阴',
'大腿':'大腿前侧,大腿后侧,大腿内侧,大腿外侧,股四头肌,股二头肌,内收肌,髂胫束',
'膝盖':'髌骨,膝前侧,膝内侧,膝外侧,膝后侧,腘窝,髌腱,胫骨粗隆',
'小腿／脚踝':'小腿前侧,小腿后侧,小腿内侧,小腿外侧,胫骨,腓骨,腓肠肌,比目鱼肌,跟腱,内踝,外踝',
'脚部／脚趾':'足背,足底,足弓,足跟,前脚掌,跖骨,拇趾,第二脚趾,第三脚趾,第四脚趾,第五脚趾,趾关节',
'其他／多处':'全身,多处游走,深层疼痛,位置不明,自定义'
};
Object.keys(regions).forEach(t=>{let o=document.createElement('option');o.value=o.textContent=t;$('region').append(o)});
let data={marks:[],areas:[],severity:5,kinds:[],notes:''},mode='rotate',drawing=null,modelURL=null,modelReady=false;
const keys='renkang-high-detail-body-model';
function dbOpen(){return new Promise((ok,no)=>{const q=indexedDB.open('renkang-body-assets',1);q.onupgradeneeded=()=>q.result.createObjectStore('models');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function storeFile(file){const db=await dbOpen();await new Promise((ok,no)=>{const t=db.transaction('models','readwrite'),q=t.objectStore('models').put(file,keys);q.onsuccess=ok;q.onerror=()=>no(q.error)});db.close()}
async function cached(){const db=await dbOpen();const file=await new Promise((ok,no)=>{const q=db.transaction('models','readonly').objectStore('models').get(keys);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});db.close();return file}
function load(file){if(modelURL)URL.revokeObjectURL(modelURL);modelURL=URL.createObjectURL(file);viewer.src=modelURL;$('status').textContent='正在读取高精度人体…'}
$('uploadBtn').onclick=()=>$('modelInput').click();
$('modelInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.glb')){alert('请选择你上传的 .glb 人体模型');return}load(file);try{await storeFile(file)}catch(err){$('status').textContent='模型可使用，但此浏览器无法记住文件：'+err.message}};
viewer.addEventListener('load',()=>{modelReady=true;$('status').textContent='高精度人体加载完成';setTimeout(()=>$('status').style.display='none',1500);$('uploadBtn').textContent='更换人体模型'});
viewer.addEventListener('error',()=>{$('status').textContent='模型读取失败，请重新选择 GLB 文件'});
viewer.src='models/male-base-mesh-base_male.glb?v=20261028';$('status').textContent='正在读取指定的高精度人体模型…';viewer.addEventListener('error',()=>{cached().then(f=>{if(f)load(f);else $('status').textContent='指定 GLB 尚未部署成功，请勿使用旧人体；可先手动选取模型文件'}).catch(()=>{$('status').textContent='指定 GLB 尚未部署成功'});},{once:true});
function summary(){$('summary').textContent='已画 '+data.marks.length+' 处，已选 '+data.areas.length+' 个部位'+(data.areas.length?'：'+data.areas.join('、'):'')+'。程度 '+data.severity+'/10'}
function parts(){$('parts').replaceChildren();for(const p of regions[$('region').value].split(',')){let b=document.createElement('button');const name=$('side').value+' · '+p;b.textContent=p;b.classList.toggle('on',data.areas.includes(name));b.onclick=()=>{data.areas=data.areas.includes(name)?data.areas.filter(x=>x!==name):[...data.areas,name];parts();summary()};$('parts').append(b)}}$('region').onchange=parts;$('side').onchange=parts;
['酸痛','刺痛','胀痛','钝痛','灼痛','麻木','牵拉痛','放射痛','跳痛','压痛'].forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{data.kinds=data.kinds.includes(t)?data.kinds.filter(x=>x!==t):[...data.kinds,t];b.classList.toggle('on',data.kinds.includes(t));summary()};$('kinds').append(b)});
$('severity').oninput=()=>{data.severity=+$('severity').value;$('sv').textContent='疼痛程度 '+data.severity+'/10';summary()};$('notes').oninput=()=>data.notes=$('notes').value;
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));paint.style.pointerEvents=m==='rotate'?'none':'auto';paint.style.touchAction='none';$('hint').textContent=m==='rotate'?'单指旋转 · 双指缩放':'请在人体上标记；完成后选「旋转」查看其他角度'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function size(){const rect=paint.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);paint.width=rect.width*d;paint.height=rect.height*d;redraw()}new ResizeObserver(size).observe(paint);
function redraw(){ctx.clearRect(0,0,paint.width,paint.height);ctx.lineWidth=3*(devicePixelRatio||1);ctx.strokeStyle='#d7362a';ctx.fillStyle='#d7362a66';for(const m of [...data.marks,...(drawing?[drawing]:[])]){const pts=m.points;if(!pts.length)continue;ctx.beginPath();if(m.type==='point'){ctx.arc(pts[0][0]*paint.width,pts[0][1]*paint.height,9,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(m.type==='circle'){const a=pts[0],b=pts[1]||a;ctx.ellipse((a[0]+b[0])*paint.width/2,(a[1]+b[1])*paint.height/2,Math.max(6,Math.abs(a[0]-b[0])*paint.width/2),Math.max(6,Math.abs(a[1]-b[1])*paint.height/2),0,0,Math.PI*2);ctx.stroke()}else{pts.forEach((p,i)=>i?ctx.lineTo(p[0]*paint.width,p[1]*paint.height):ctx.moveTo(p[0]*paint.width,p[1]*paint.height));ctx.stroke()}}}
function point(e){const r=paint.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
paint.addEventListener('pointerdown',e=>{if(mode==='rotate')return;paint.setPointerCapture(e.pointerId);drawing={type:mode,points:[point(e)],orbit:viewer.getCameraOrbit?.()};redraw()});
paint.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);if(mode==='draw')drawing.points.push(p);if(mode==='circle')drawing.points[1]=p;redraw()});
paint.addEventListener('pointerup',e=>{if(!drawing)return;if(drawing.type==='circle'&&drawing.points.length===1)drawing.points.push([drawing.points[0][0]+.03,drawing.points[0][1]+.03]);data.marks.push(drawing);drawing=null;redraw();summary()});
document.querySelectorAll('[data-orbit],#front,#back,#left,#right').forEach(b=>{b.onclick=()=>{const a=b.id==='front'?0:b.id==='left'?90:b.id==='back'?180:270;viewer.cameraOrbit=a+'deg 90deg 3.8m';setMode('rotate')}});$('reset').onclick=()=>{viewer.cameraOrbit='0deg 90deg 3.8m';setMode('rotate')};
$('undo').onclick=()=>{data.marks.pop();redraw();summary()};$('clear').onclick=()=>{if(!confirm('清除疼痛标记与部位？'))return;data={marks:[],areas:[],severity:5,kinds:[],notes:''};$('notes').value='';$('severity').value=5;parts();redraw();summary()};
function receiver(){return window.opener||((window.parent!==window)?window.parent:null)}
$('save').onclick=()=>{data.notes=$('notes').value;const r=receiver();if(r){r.postMessage({type:'renkang-pain-save',payload:JSON.stringify(data)},location.origin);if(window.opener)setTimeout(()=>window.close(),180)}else{localStorage.setItem('renkang-pain-demo',JSON.stringify(data));alert('演示标记已保存')}};
$('close').onclick=()=>{const r=receiver();if(r){r.postMessage({type:'renkang-pain-close'},location.origin);window.close()}else history.back()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='renkang-pain-init')return;try{const d=JSON.parse(e.data.payload);if(d&&Array.isArray(d.marks)&&Array.isArray(d.areas)){data=d;$('notes').value=d.notes||'';$('severity').value=d.severity??5;parts();redraw();summary()}}catch{}});
if(window.opener)window.opener.postMessage({type:'renkang-pain-ready'},location.origin);
parts();summary();
</script></body></html>
